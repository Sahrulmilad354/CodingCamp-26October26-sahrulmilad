<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <canvas id="bg-canvas"></canvas>
  </div>

  <main class="container">

    <!-- Greeting -->
    <section class="card greeting" aria-label="Greeting">
      <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">🌙 Dark</button>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
      <h1 id="greeting" class="greeting-text">Hello</h1>
      <form id="name-form" class="inline-form name-form" autocomplete="off">
        <input id="name-input" type="text" placeholder="Your name" maxlength="30" aria-label="Your name">
        <button type="submit" class="btn btn-secondary">Save name</button>
      </form>
    </section>

    <div class="grid">

      <!-- Focus Timer -->
      <section class="card timer" aria-label="Focus timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="btn-row">
          <button id="timer-start" class="btn btn-primary" type="button">Start</button>
          <button id="timer-stop" class="btn btn-secondary" type="button">Stop</button>
          <button id="timer-reset" class="btn btn-secondary" type="button">Reset</button>
        </div>
        <form id="duration-form" class="inline-form duration-form" autocomplete="off">
          <label for="duration-input">Minutes</label>
          <input id="duration-input" type="number" min="1" max="180" value="25">
          <button type="submit" class="btn btn-secondary">Set</button>
        </form>
      </section>

      <!-- To-Do List -->
      <section class="card tasks" aria-label="To-do list">
        <h2>Tasks</h2>
        <form id="task-form" class="inline-form" autocomplete="off">
          <input id="task-input" type="text" placeholder="Add a new task..." maxlength="120" aria-label="New task">
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="task-empty" class="empty" hidden>No tasks yet. Add your first one!</p>
        <ul id="task-list" class="task-list"></ul>
      </section>

      <!-- Quick Links -->
      <section class="card links" aria-label="Quick links">
        <h2>Quick Links</h2>
        <form id="link-form" class="inline-form" autocomplete="off">
          <input id="link-name" type="text" placeholder="Link name" maxlength="30" aria-label="Link name">
          <input id="link-url" type="text" placeholder="URL" aria-label="Link URL">
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="link-list" class="link-list"></div>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
